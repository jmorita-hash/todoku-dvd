# Todoku DVD の設定（既定値）
#
# 作業者ごとに変えたい場合は、次のファイルに同じ書式で書くと上書きできる。
#   ~/Library/Application Support/TodokuDVD/config.conf
# 書式はシェルの変数代入（KEY="値"）。

# --- 映像・音声 ---
PAD_SEC=10                # 前後に足す無地画面・無音の秒数（作業時に1本ごとに変更可）
PAD_SEC_MAX=60            # 指定できる秒数の上限
PAD_COLOR="black"         # 無地画面の色（black / white / #RRGGBB）
TV_STANDARD="ntsc"        # 日本の家庭用プレーヤー向け。現状 ntsc のみ対応
ASPECT="16:9"             # 16:9 以外の動画は黒帯を付けて16:9に収める
VIDEO_MAX_KBPS=8000       # 映像ビットレート上限（DVDの規格上限は約9800）
VIDEO_MIN_KBPS=3000       # これを下回るほど長い動画はエラーにする
AUDIO_KBPS=448            # 音声（AC-3）ビットレート
AUDIO_LANG="ja"

# --- ディスク ---
DISC_BYTES=4300000000     # DVD-R 1層に安全に収まる容量の目安
VOLUME_NAME="TODOKU"      # ディスク名（半角英大文字・数字・_ で32文字以内）
END_ACTION="stop"         # 再生が終わったら: stop=停止（リピートなし・サイト表記どおり） / loop=繰り返す
VERIFY_BURN=1             # 1=書き込み後に検証する（推奨） / 0=しない
DISC_TYPES="DVD-R"        # 使ってよいディスクの種類（サイト表記どおり DVD-R のみ）

# --- 保存先 ---
OUTPUT_DIR="$HOME/Movies/Todoku DVD"
KEEP_ISO_DAYS=30          # これより古いディスクイメージは自動で削除（0=削除しない）

# --- 更新チェック ---
# GitHubの「所有者/リポジトリ名」。ビルド時に自動で埋め込まれる。空なら更新チェックしない
UPDATE_REPO=""
UPDATE_CHECK_HOURS=24     # 更新チェックの間隔（時間）
