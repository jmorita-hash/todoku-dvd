# ビルド・テスト・配布を自動で行う
# ・main に push / PR          → Macでビルドし、Apple製チップとIntelの両方でテスト
# ・v0.2.0 のようなタグを push → 上に加えて、Releases にアプリの zip を公開
# ・Actions の画面で「Run workflow」→「Releases に公開する」にチェック
#   → app/VERSION の番号（v0.3.0 など）でタグと Release を作って公開（タグを push できないとき用）
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "テストが通ったら Releases に公開する（app/VERSION の番号で）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: シェルスクリプトの文法チェック
        run: |
          for f in app/todoku-dvd.sh app/lib/*.sh tests/*.sh build/*.sh; do bash -n "$f"; done
          shellcheck -S error -s bash app/todoku-dvd.sh app/lib/*.sh tests/*.sh build/*.sh

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: build/cache
          key: deps-${{ hashFiles('build/fetch-ffmpeg.sh', 'build/build-dvdauthor.sh') }}
      - name: ビルド用ツール
        run: brew install bison flex
      - name: ffmpeg（ユニバーサル）
        run: build/ci-run.sh build/fetch-ffmpeg.sh
      - name: dvdauthor（ユニバーサル）
        run: build/ci-run.sh build/build-dvdauthor.sh
      - name: アプリ組み立て
        run: build/ci-run.sh build/make-app.sh
        env:
          UPDATE_REPO: ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: TodokuDVD
          path: dist/TodokuDVD.zip
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]   # Apple製チップ / Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: TodokuDVD
          path: dist
      - name: 展開と署名の確認
        run: |
          cd dist && ditto -x -k TodokuDVD.zip . && ls -la
          codesign --verify --deep --verbose=2 "Todoku DVD.app"
          lipo -info "Todoku DVD.app/Contents/Resources/bin/ffmpeg" "Todoku DVD.app/Contents/Resources/bin/dvdauthor"
      - name: 動作テスト
        run: build/ci-run.sh tests/smoke.sh "dist/Todoku DVD.app/Contents/Resources/app/todoku-dvd.sh"

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: TodokuDVD
          path: dist
      - name: 公開するバージョンを決める
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(cat app/VERSION)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "v$ver" = "$GITHUB_REF_NAME" || { echo "::error::app/VERSION（$ver）とタグ（$GITHUB_REF_NAME）が違います"; exit 1; }
          elif gh release view "v$ver" >/dev/null 2>&1; then
            echo "::error::v$ver はすでに公開されています。app/VERSION の番号を上げてください"; exit 1
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
      - name: Release を作成
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          awk -v v="$VER" '$0 ~ "^## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          printf '\n---\n作業者の方は下の **TodokuDVD.zip** をダウンロードしてください。\n' >> notes.md
          # タグがまだなければ、テストしたコミット（GITHUB_SHA）にタグを作る
          gh release create "v$VER" dist/TodokuDVD.zip --target "$GITHUB_SHA" \
            --title "Todoku DVD $VER" --notes-file notes.md
